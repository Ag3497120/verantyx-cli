<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Verantyx God Mode — 思考が見えるAI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">◆</span>
    <div>
      <h1>Verantyx <span class="thin">God Mode</span></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
  </div>
  <div class="head-right">
    <select id="lang">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
    </select>
    <div class="status" id="status">…</div>
  </div>
</header>

<main>
  <section class="scene-wrap">
    <canvas id="scene"></canvas>
    <div class="scene-hud">
      <div class="hud-item"><span class="dot commander"></span>Commander</div>
      <div class="hud-item"><span class="dot scout"></span>Scout ×2</div>
      <div class="hud-item"><span class="dot worker"></span>Worker ×2</div>
      <div class="hud-item"><span class="dot consensus"></span><span data-i18n="consensus"></span></div>
    </div>
    <div class="round-badge" id="roundBadge"></div>
    <div class="metrics">
      <div class="metric"><label data-i18n="cosLabel"></label>
        <div class="bar"><div id="cosBar"></div></div><span id="cosVal">—</span></div>
      <div class="metric"><label data-i18n="entLabel"></label>
        <div class="bar"><div id="entBar" class="ent"></div></div><span id="entVal">—</span></div>
    </div>
    <canvas id="radar" width="220" height="220"></canvas>
  </section>

  <section class="panel">
    <div class="ask-box">
      <input id="q" maxlength="300">
      <button id="askBtn" data-i18n="askBtn"></button>
    </div>
    <div class="presets" id="presets"></div>
    <p class="note" data-i18n="note"></p>
    <div class="log" id="log"></div>
    <div class="answers">
      <div class="answer-card" id="councilCard" hidden>
        <h3><span data-i18n="councilTitle"></span> <span class="meta" id="councilMeta"></span></h3>
        <p id="councilAnswer"></p>
        <div class="concepts" id="concepts"></div>
      </div>
      <div class="answer-card baseline" id="baselineCard" hidden>
        <h3><span data-i18n="baselineTitle"></span> <span class="meta" id="baselineMeta"></span></h3>
        <p id="baselineAnswer"></p>
      </div>
    </div>
  </section>
</main>

<section class="explain">
  <h2 data-i18n="explainTitle"></h2>
  <div class="cards">
    <div class="card"><h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p></div>
    <div class="card"><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p></div>
    <div class="card"><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p></div>
    <div class="card"><h3 data-i18n="c4t"></h3><p data-i18n="c4p"></p></div>
  </div>
  <p class="foot">
    Engine: jcross_engine (Rust / candle CPU) · Model: Qwen2.5-0.5B-Instruct → JGEN ·
    <a href="https://github.com/Ag3497120/verantyx-cli" target="_blank">GitHub: verantyx-cli</a> —
    <span data-i18n="foot"></span>
  </p>
</section>

<script type="module" src="/static/app.js"></script>
</body>
</html>
